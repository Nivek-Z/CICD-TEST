name: CI

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: |
            charts/demo-app/values.yaml
            .github/workflows/ci.yaml
          config_data: |
            extends: default
            rules:
              line-length: disable
              document-start: disable
              truthy: disable
              braces: disable
              brackets: disable

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

      - name: Check workflow syntax
        uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  build-and-deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_LOWER }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_LOWER }}:latest

      - name: Update Helm values with new image tag
        run: |
          sed -i "s|tag: .*|tag: ${{ github.sha }}|" charts/demo-app/values.yaml

      - name: Commit and push updated values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/demo-app/values.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update image tag to ${{ github.sha }} [skip ci]"
            git push
          fi

      - name: Clean up old GHCR images
        uses: actions/delete-package-versions@v5
        with:
          package-name: cicd-test
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
