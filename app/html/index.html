<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitOps Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 48px 56px;
            max-width: 540px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }
        h1 { font-size: 28px; margin-bottom: 8px; letter-spacing: 1px; }
        .badge {
            display: inline-block;
            background: #60a5fa;
            color: #fff;
            font-size: 12px;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 24px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 24px 0;
            text-align: left;
        }
        .info-item {
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 12px 16px;
        }
        .info-item .label { font-size: 11px; text-transform: uppercase; opacity: 0.5; letter-spacing: 0.5px; }
        .info-item .value { font-size: 16px; font-weight: 600; margin-top: 4px; }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.7;
        }
        .status .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">GitOps Demo</div>
        <h1>Hello from ArgoCD + k3s!</h1>
        <p style="opacity:0.6; margin-bottom:8px;">Nginx static site deployed via GitOps</p>
        <div class="info-grid">
            <div class="info-item">
                <div class="label">Version</div>
                <div class="value" id="version">1.0.0</div>
            </div>
            <div class="info-item">
                <div class="label">Commit</div>
                <div class="value" id="commit"><code>{{COMMIT_SHA}}</code></div>
            </div>
            <div class="info-item">
                <div class="label">Deployed</div>
                <div class="value" id="deployed">{{DEPLOY_TIME}}</div>
            </div>
            <div class="info-item">
                <div class="label">Namespace</div>
                <div class="value" id="namespace">{{NAMESPACE}}</div>
            </div>
        </div>
        <div class="status">
            <span class="dot"></span>
            Running on k3s cluster &middot; Synchronized via ArgoCD
        </div>
    </div>
</body>
</html>
